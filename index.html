<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Engagement Studio · Purchasing</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1c2532;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#161f35;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{font-size:22px;margin:0}h2{font-size:19px}main{max-width:1100px;margin:24px auto;padding:0 18px}.card{background:white;border:1px solid #dfe4ed;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px #00000009}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#5f6a7b;font-size:13px}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd4e0;border-radius:7px;font:inherit;background:white}textarea{min-height:75px}button{background:#293f7d;color:white;border:0;border-radius:7px;padding:10px 14px;font-weight:650;cursor:pointer}button.secondary{background:#e8edf5;color:#25385f}button.danger{background:#a6343a}button:disabled{opacity:.5;cursor:wait}.tabs{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}.tabs button.active{background:#101e39}.badge{display:inline-block;background:#e7ebf3;border-radius:99px;padding:4px 9px;font-size:12px;text-transform:capitalize}.badge.pending{background:#fff0c6}.badge.approved{background:#d5f1df}.badge.rejected{background:#ffe0e0}.badge.ordered{background:#dce9ff}.badge.received{background:#d4f2e5}.badge.revision{background:#ffe3c6}.item{border:1px solid #dce3ed;border-radius:9px;padding:15px;margin:12px 0}.error{background:#fff0f0;color:#8c1e24;padding:12px;border-radius:7px;margin:12px 0}.success{background:#e5f6eb;color:#16572b;padding:12px;border-radius:7px;margin:12px 0}.small{font-size:12px}.stat{font-size:25px;font-weight:750}.hidden{display:none}a{color:#234ea1}pre{white-space:pre-wrap}input[type=file]{padding:8px}
</style></head><body><header><div><h1>Social Engagement Studio</h1><div class="small">Materials requests · Purchasing · SAIC</div></div><div class="row"><span id="identity"></span><button id="logout" class="secondary hidden" onclick="logout()">Sign out</button></div></header><main><div id="message"></div><div id="app">Loading…</div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://zahbjcvbrprzbygfhmau.supabase.co','sb_publishable_w2QAbjjaNh0qzTAs_wNB_Q_4lWPfRpV');
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const usd=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const fmt=d=>new Date(d).toLocaleDateString();const today=()=>new Date().toISOString().slice(0,10);let session=null,profile=null,teams=[],requests=[],items=[],attachments=[],settings=null,tab='overview',draftRows=1,detailId=null;
function msg(t,error=false){$('message').innerHTML=`<div class="${error?'error':'success'}">${esc(t)}</div>`;window.scrollTo(0,0)}function fail(e){console.error(e);msg(e?.message||String(e),true)}
async function init(){const {data:{session:s}}=await supabase.auth.getSession();session=s;await load()}async function load(){if(!session){profile=null;loginScreen();return}try{const {data,error}=await supabase.from('profiles').select('*').eq('user_id',session.user.id).single();if(error)throw error;profile=data;if(!['faculty','administrator'].includes(profile.role))throw Error('Only faculty and administrators can sign in here');const results=await Promise.all([supabase.from('teams').select('*').order('name'),supabase.from('requests').select('*').order('created_at',{ascending:false}),supabase.from('items').select('*').order('updated_at',{ascending:false}),supabase.from('attachments').select('*'),supabase.from('settings').select('*').maybeSingle()]);for(const r of results)if(r.error)throw r.error;[teams,requests,items,attachments]=results.slice(0,4).map(r=>r.data||[]);settings=results[4].data;render()}catch(e){fail(e);$('app').innerHTML='<div class="card">Your account may not have a profile yet. Ask the instructor to assign your role and team in Supabase.</div>'}}
function loginScreen(){$('identity').textContent='';$('logout').classList.add('hidden');$('app').innerHTML=`<div class="grid"><section class="card"><h2>Student materials request</h2><p class="muted">No account required. Select your project team and enter your name.</p><button id="studentPortal">Open student submission</button></section><section class="card"><h2>Faculty / administrator</h2><form id="loginForm"><label>Email</label><input type="email" name="email" required autocomplete="username"><label>Password</label><input type="password" name="password" required autocomplete="current-password"><p><button type="submit">Sign in</button></p></form></section></div>`;$('studentPortal').onclick=()=>publicForm();$('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {data,error}=await supabase.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)return fail(error);session=data.session;$('message').innerHTML='';await load()}}
const PUBLIC_ENDPOINT='https://zahbjcvbrprzbygfhmau.supabase.co/functions/v1/public-submit';
// Public Cloudflare Turnstile site key. Never put the secret key here.
const TURNSTILE_SITE_KEY='0x4AAAAAAGDZKQbGGyeSpX0q';
let publicTeams=[];
async function publicForm(){try{const res=await fetch(PUBLIC_ENDPOINT+'?action=teams',{headers:{'apikey':'sb_publishable_w2QAbjjaNh0qzTAs_wNB_Q_4lWPfRpV'}});const data=await res.json();if(!res.ok)throw Error(data.error||'Cannot load teams');publicTeams=data.teams;drawPublicForm()}catch(e){fail(e)}}
function drawPublicForm(){$('app').innerHTML=`<div class="card"><div class="between"><h2>Student materials request</h2><button class="secondary" id="backLogin">Faculty / admin sign in</button></div><p class="muted">No login needed. Each project has a $500 budget. Faculty will review before anything is purchased.</p><form id="publicRequest"><label>Project team *</label><select name="team" required>${publicTeams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select><div class="grid"><div><label>Your first and last name *</label><input name="requester" minlength="2" maxlength="120" required></div><div><label>Needed by *</label><input name="needed" type="date" value="${today()}" required></div></div><label>What are you building?</label><textarea name="purpose" maxlength="2000"></textarea><h2>Materials</h2><div id="materialRows"></div><div class="row"><button class="secondary" type="button" id="addRow">+ Add material</button></div><p class="muted">Attach PDFs or images (maximum 3 MB each). Complete the verification to submit.</p><div id="captcha"></div><p><button id="submitBtn" type="submit">Submit request for faculty review</button></p></form></div>`;$('backLogin').onclick=loginScreen;draftRows=0;addRow();$('addRow').onclick=addRow;$('publicRequest').onsubmit=submitPublic;loadTurnstile()}
function loadTurnstile(){if(TURNSTILE_SITE_KEY.startsWith('REPLACE_')){$('captcha').innerHTML='<div class="error">Site administrator: configure the Turnstile site key in index.html before public submissions can work.</div>';return}const renderCaptcha=()=>{if(window.turnstile){$('captcha').innerHTML='';window.turnstile.render('#captcha',{sitekey:TURNSTILE_SITE_KEY})}};if(window.turnstile)return renderCaptcha();const script=document.createElement('script');script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';script.onload=renderCaptcha;document.head.appendChild(script)}
async function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('File reading failed'));reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.readAsDataURL(file)})}
async function submitPublic(e){e.preventDefault();const btn=$('submitBtn');btn.disabled=true;try{const f=new FormData(e.target),token=window.turnstile?.getResponse();if(!token)throw Error('Complete the verification before submitting');const rows=[...document.querySelectorAll('.materialRow')];if(rows.length>20)throw Error('Maximum 20 materials per request');const payload=[];for(const row of rows){const get=n=>row.querySelector(`[name="${n}"]`).value;const file=row.querySelector('[name="file"]').files[0];let attachment=null;if(file){if(file.size>3*1024*1024)throw Error('Attachment exceeds 3 MB');if(!['application/pdf','image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Unsupported attachment type');attachment={name:file.name,type:file.type,base64:await fileToBase64(file)}}payload.push({name:get('name'),qty:Number(get('qty')),unit_price:Number(get('unit_price')),vendor:get('vendor'),product_url:get('product_url'),justification:get('justification'),attachment})}const res=await fetch(PUBLIC_ENDPOINT,{method:'POST',headers:{'content-type':'application/json','apikey':'sb_publishable_w2QAbjjaNh0qzTAs_wNB_Q_4lWPfRpV'},body:JSON.stringify({team_id:f.get('team'),requester_name:f.get('requester'),needed_by:f.get('needed'),purpose:f.get('purpose'),items:payload,turnstile_token:token})});const out=await res.json();if(!res.ok)throw Error(out.error||'Submission failed');$('app').innerHTML=`<div class="card"><h2>Request submitted</h2><p>Faculty can now review your materials request.</p><p><strong>Confirmation number:</strong> <code>${esc(out.request_id)}</code></p><p class="muted">Keep this number if you need to follow up with your instructor.</p><button id="another">Submit another request</button></div>`;$('another').onclick=drawPublicForm;msg('Request submitted successfully.'+(out.attachment_warnings?.length?' Warning: '+out.attachment_warnings.join('; '):''),!!out.attachment_warnings?.length)}catch(ex){fail(ex);window.turnstile?.reset()}finally{btn.disabled=false}}
async function logout(){await supabase.auth.signOut();session=null;tab='overview';$('message').innerHTML='';loginScreen()}window.logout=logout;
function teamName(id){return teams.find(t=>t.id===id)?.name||'Unknown team'}function reqFor(item){return requests.find(r=>r.id===item.request_id)}function cost(i){return i.status==='received'&&i.actual_total!==null?Number(i.actual_total):Number(i.qty)*Number(i.unit_price)}function committed(i){return ['approved','ordered','received'].includes(i.status)}function stats(teamId){const a=items.filter(i=>!teamId||reqFor(i)?.team_id===teamId);return{pending:a.filter(i=>['pending','revision'].includes(i.status)).reduce((s,i)=>s+cost(i),0),committed:a.filter(committed).reduce((s,i)=>s+cost(i),0),spent:a.filter(i=>i.status==='received').reduce((s,i)=>s+cost(i),0)}}
function render(){$('identity').textContent=profile.display_name+' · '+(profile.role);$('logout').classList.remove('hidden');const options=[['overview','Overview'],['requests','Requests'],['purchasing','Purchasing'],['budgets','Budgets']];$('app').innerHTML=`<nav class="tabs">${options.map(([k,t])=>`<button class="${tab===k?'active':'secondary'}" data-tab="${k}">${t}</button>`).join('')}</nav><div id="content"></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;detailId=null;render()});$('content').innerHTML=tab==='overview'?overview():tab==='requests'?requestList():tab==='new'?newForm():tab==='purchasing'?purchasing():tab==='budgets'?budgets():'';if(tab==='new')wireNewForm();document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(b.dataset.detail));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(b.dataset.review,b.dataset.decision));document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>assignBuyer(b.dataset.assign,b.dataset.buyer));document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>order(b.dataset.order));document.querySelectorAll('[data-receive]').forEach(b=>b.onclick=()=>receive(b.dataset.receive));document.querySelectorAll('[data-revise]').forEach(b=>b.onclick=()=>revise(b.dataset.revise));document.querySelectorAll('[data-attachment]').forEach(b=>b.onclick=()=>downloadAttachment(b.dataset.attachment));document.querySelectorAll('[data-budget]').forEach(b=>b.onclick=()=>changeBudget(b.dataset.budget));}
function overview(){const pid=null,s=stats(pid),budget=pid?teams.find(t=>t.id===pid)?.budget:settings?.class_budget;return `<div class="grid">${[['Budget',usd(budget)],['Committed and spent',usd(s.committed)],['Available',usd(Number(budget)-s.committed)],['Awaiting review',usd(s.pending)]].map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="stat">${v}</div></div>`).join('')}</div><div class="card"><h2>Recent materials</h2>${list(items.slice(0,12))}</div>`}
function list(arr){if(!arr.length)return '<p class="muted">No requests yet.</p>';return arr.map(i=>{const r=reqFor(i);return `<div class="item"><div class="between"><div><strong>${esc(i.name)}</strong><div class="muted">${esc(teamName(r?.team_id))} · ${esc(r?.requester_name)} · ${esc(i.qty)} × ${usd(i.unit_price)}</div></div><span class="badge ${esc(i.status)}">${esc(i.status)}</span></div><div class="row" style="margin-top:10px"><button class="secondary" data-detail="${i.id}">Review details</button></div></div>`}).join('')}
function requestList(){return `<div class="card"><h2>${profile.role==='faculty'?'Faculty review queue':'All materials requests'}</h2><p class="muted">${items.filter(i=>i.status==='pending').length} item(s) awaiting review</p>${list(items)}</div>`}
function newForm(){return `<form id="newRequest" class="card"><h2>Submit a materials request</h2><p class="muted">Team: ${esc(teamName(profile.team_id))}. Your request will be visible to faculty after submission.</p><div class="grid"><div><label>Requested by (first and last name) *</label><input name="requester" required minlength="2"></div><div><label>Needed by *</label><input name="needed" type="date" value="${today()}" required></div></div><label>Project purpose</label><textarea name="purpose" placeholder="Describe what you're building"></textarea><h2>Materials</h2><div id="materialRows"></div><div class="row"><button type="button" class="secondary" id="addRow">+ Add material</button><button type="submit" id="submitBtn">Submit to faculty</button></div><p class="muted">Supporting files: PDF, JPG, PNG, or WebP, up to 5 MB each. Uploads are private to authorized users.</p></form>`}
function rowHTML(n){return `<div class="item materialRow"><div class="between"><strong>Material ${n}</strong><button type="button" class="secondary removeRow">Remove</button></div><div class="grid"><div><label>Material name *</label><input name="name" required></div><div><label>Quantity *</label><input name="qty" type="number" min="0.01" step="any" value="1" required></div><div><label>Estimated unit price ($) *</label><input name="unit_price" type="number" min="0" step="0.01" required></div><div><label>Vendor</label><input name="vendor"></div><div><label>Product link</label><input name="product_url" type="url" placeholder="https://..."></div></div><label>Why is this needed? *</label><textarea name="justification" required></textarea><label>Supporting document (optional)</label><input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.webp"></div>`}
function addRow(){$('materialRows').insertAdjacentHTML('beforeend',rowHTML(++draftRows));$('materialRows').querySelectorAll('.removeRow').forEach(b=>b.onclick=()=>{if(document.querySelectorAll('.materialRow').length>1)b.closest('.materialRow').remove()})}
function wireNewForm(){draftRows=0;addRow();$('addRow').onclick=addRow;$('newRequest').onsubmit=submit}
async function submit(e){e.preventDefault();const btn=$('submitBtn');btn.disabled=true;try{const f=new FormData(e.target),rows=[...document.querySelectorAll('.materialRow')],payload=rows.map(row=>{const get=n=>row.querySelector(`[name="${n}"]`).value;return{name:get('name'),qty:Number(get('qty')),unit_price:Number(get('unit_price')),vendor:get('vendor'),product_url:get('product_url'),justification:get('justification'),}});const {data:rid,error}=await supabase.rpc('submit_request',{p_team:profile.team_id,p_requester:f.get('requester'),p_purpose:f.get('purpose'),p_needed:f.get('needed'),p_items:payload});if(error)throw error;let uploadErrors=[];const {data:ordered,error:orderError}=await supabase.from('items').select('id,name,position').eq('request_id',rid).order('position');if(orderError)throw orderError;
for(let idx=0;idx<rows.length;idx++){const file=rows[idx].querySelector('[name="file"]').files[0];if(!file)continue;const matching=ordered[idx];if(!matching){uploadErrors.push(file.name+': item not found');continue}matching._used=true;try{if(file.size>5*1024*1024)throw Error('File exceeds 5 MB');if(!['application/pdf','image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Unsupported file type');const path=matching.id+'/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await supabase.storage.from('evidence').upload(path,file,{upsert:false});if(up.error)throw up.error;const ins=await supabase.from('attachments').insert({item_id:matching.id,storage_path:path,filename:file.name});if(ins.error)throw ins.error}catch(ex){uploadErrors.push(file.name+': '+ex.message)}}
await load();tab='requests';render();msg('Request submitted for faculty review.'+(uploadErrors.length?' Some files did not upload: '+uploadErrors.join('; '):''),!!uploadErrors.length)}catch(ex){fail(ex)}finally{btn.disabled=false}}
function showDetail(id){detailId=id;const i=items.find(x=>x.id===id),r=reqFor(i);if(!i)return;const at=attachments.filter(a=>a.item_id===id);$('content').innerHTML=`<div class="card"><button class="secondary" id="back">← Back</button><h2>${esc(i.name)} <span class="badge ${esc(i.status)}">${esc(i.status)}</span></h2><p><strong>${esc(teamName(r?.team_id))}</strong> · Requested by ${esc(r?.requester_name)} · Needed ${esc(r?.needed_by)}</p><p>${esc(r?.purpose)}</p><div class="grid"><div><b>Quantity</b><p>${esc(i.qty)}</p></div><div><b>Unit estimate</b><p>${usd(i.unit_price)}</p></div><div><b>Estimated total</b><p>${usd(i.qty*i.unit_price)}</p></div><div><b>Purchaser</b><p>${esc(i.buyer)}</p></div></div><p><b>Justification:</b> ${esc(i.justification)}</p><p><b>Vendor:</b> ${esc(i.vendor)}</p>${i.product_url&&/^https?:\/\//i.test(i.product_url)?`<p><a href="${esc(i.product_url)}" target="_blank" rel="noopener noreferrer">View product</a></p>`:''}<p><b>Faculty note:</b> ${esc(i.faculty_note||'None')}</p><p><b>Order reference:</b> ${esc(i.order_reference||'Not ordered')}</p><p><b>Actual cost:</b> ${i.actual_total===null?'Not entered':usd(i.actual_total)}</p><div>${at.map(a=>`<button class="secondary" data-attachment="${a.id}">📎 ${esc(a.filename)}</button>`).join(' ')}</div><div class="row" style="margin-top:18px">${actions(i)}</div></div>`;$('back').onclick=render;document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(b.dataset.review,b.dataset.decision));document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>assignBuyer(b.dataset.assign,b.dataset.buyer));document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>order(b.dataset.order));document.querySelectorAll('[data-receive]').forEach(b=>b.onclick=()=>receive(b.dataset.receive));document.querySelectorAll('[data-revise]').forEach(b=>b.onclick=()=>revise(b.dataset.revise));document.querySelectorAll('[data-attachment]').forEach(b=>b.onclick=()=>downloadAttachment(b.dataset.attachment))}
function actions(i){let action='';if(profile.role==='faculty'&&['pending','revision'].includes(i.status))action=`<button data-review="${i.id}" data-decision="approved">Approve</button><button class="secondary" data-review="${i.id}" data-decision="revision">Request changes</button><button class="danger" data-review="${i.id}" data-decision="rejected">Reject</button>`;else if(i.status==='approved'&&profile.role===i.buyer)action=`<button data-order="${i.id}">Mark ordered</button>`;else if(i.status==='ordered'&&profile.role===i.buyer)action=`<button data-receive="${i.id}">Mark received</button>`;if(profile.role==='faculty'&&['pending','revision','approved'].includes(i.status)){const next=i.buyer==='faculty'?'administrator':'faculty';action+=`<button class="secondary" data-assign="${i.id}" data-buyer="${next}">Assign to ${next==='faculty'?'myself':'administrator'}</button>`}return action}
async function assignBuyer(id,buyer){if(!confirm(`Assign this purchase to ${buyer==='faculty'?'faculty (you)':'the purchasing administrator'}?`))return;try{await call('assign_item_buyer',{p_item:id,p_buyer:buyer})}catch(e){fail(e)}}
async function call(fn,args){const {error}=await supabase.rpc(fn,args);if(error)throw error;await load();tab='requests';render();msg('Saved successfully')}
async function review(id,decision){const note=prompt(decision==='approved'?'Approval note (optional):':'Explain your decision:','');if(note===null)return;try{await call('review_item',{p_item:id,p_status:decision,p_note:note})}catch(e){fail(e)}}
async function order(id){const reference=prompt('Order number or receipt reference:');if(reference===null)return;try{await call('order_item',{p_item:id,p_reference:reference})}catch(e){fail(e)}}
async function receive(id){const i=items.find(x=>x.id===id),actual=prompt('Actual total paid ($), including taxes/shipping:',String(i.qty*i.unit_price));if(actual===null)return;try{await call('receive_item',{p_item:id,p_actual:Number(actual)})}catch(e){fail(e)}}
async function revise(id){const i=items.find(x=>x.id===id),name=prompt('Material name:',i.name);if(name===null)return;const qty=prompt('Quantity:',i.qty);if(qty===null)return;const unit=prompt('Unit price:',i.unit_price);if(unit===null)return;const vendor=prompt('Vendor:',i.vendor);if(vendor===null)return;const url=prompt('Product URL:',i.product_url);if(url===null)return;const why=prompt('Justification:',i.justification);if(why===null)return;const actor=prompt('Your first and last name (person revising):');if(actor===null)return;try{await call('revise_item',{p_item:id,p_name:name,p_qty:Number(qty),p_unit:Number(unit),p_vendor:vendor,p_url:url,p_why:why,p_actor_name:actor})}catch(e){fail(e)}}
async function downloadAttachment(id){const a=attachments.find(x=>x.id===id);if(!a)return;const {data,error}=await supabase.storage.from('evidence').createSignedUrl(a.storage_path,60);if(error)return fail(error);window.open(data.signedUrl,'_blank','noopener,noreferrer')}
function purchasing(){const relevant=items.filter(i=>i.buyer===profile.role&&['approved','ordered','received'].includes(i.status));return `<div class="card"><h2>${profile.role==='faculty'?'Faculty purchase queue':'Administrator purchase queue'}</h2><p class="muted">Only approved items assigned to your role are shown.</p>${list(relevant)}</div>`}
function budgets(){const total=stats();return `<div class="grid"><div class="card"><div class="muted">Class budget</div><div class="stat">${usd(settings?.class_budget)}</div>${profile.role==='faculty'?'<button class="secondary" data-budget="class">Edit</button>':''}</div><div class="card"><div class="muted">Committed and spent</div><div class="stat">${usd(total.committed)}</div></div><div class="card"><div class="muted">Remaining</div><div class="stat">${usd(Number(settings?.class_budget)-total.committed)}</div></div></div><div class="card"><h2>Team budgets</h2>${teams.map(t=>{const s=stats(t.id);return `<div class="item between"><div><strong>${esc(t.name)}</strong><div class="muted">${usd(s.committed)} committed · ${usd(s.spent)} spent · ${usd(s.pending)} pending</div></div><div><strong>${usd(Number(t.budget)-s.committed)} remaining</strong> ${profile.role==='faculty'?`<button class="secondary" data-budget="${t.id}">Edit</button>`:''}</div></div>`}).join('')}</div>`}
async function changeBudget(id){const current=id==='class'?settings.class_budget:teams.find(t=>t.id===id).budget;const v=prompt('New budget amount ($):',current);if(v===null)return;try{await call('update_budget',{p_team:id==='class'?null:id,p_amount:Number(v)});tab='budgets';render()}catch(e){fail(e)}}
init();
</script></body></html>
