<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Engagement Studio | Materials</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#172321;background:#f5f6f4}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:#246d62}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#122f2b;color:#e9f2ef;padding:27px 18px}.brand{font-size:20px;font-weight:800;line-height:1.18;letter-spacing:-.6px;margin:0 0 6px}.sub{font-size:12px;color:#a9c3bb;margin-bottom:36px}.side button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#c8ddd6;padding:12px;border-radius:9px;margin:4px 0}.side button.active,.side button:hover{background:#285149;color:#fff}.side .foot{font-size:11px;color:#a9c3bb;margin-top:50px;line-height:1.5}.main{padding:32px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:27px;flex-wrap:wrap}h1{font-size:29px;letter-spacing:-.8px;margin:0 0 6px}h2{font-size:18px;margin:0 0 16px}h3{font-size:15px;margin:0 0 8px}.muted{color:#687873;font-size:13px}.role{display:flex;align-items:center;gap:9px;background:#fff;padding:9px 12px;border:1px solid #dfe6e2;border-radius:10px}.role select{border:0;background:transparent;font-weight:600;max-width:220px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid #e0e6e2;border-radius:14px;padding:20px;box-shadow:0 2px 10px #18352a06}.card small{display:block;color:#657b72;font-size:12px;margin-bottom:11px}.card strong{font-size:27px;letter-spacing:-1px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}.btn{border:1px solid #cbd8d2;border-radius:9px;padding:10px 14px;background:#fff;color:#1d4038;font-weight:650;font-size:13px}.btn.primary{background:#20594f;color:#fff;border-color:#20594f}.btn.danger{color:#a33434;border-color:#e4c5c5}.btn.tiny{padding:6px 9px;font-size:12px}.btn:hover{filter:brightness(.96)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7b8984;border-bottom:1px solid #e6ece8;padding:11px 9px;white-space:nowrap}td{padding:13px 9px;border-bottom:1px solid #edf0ed;vertical-align:top}tr:last-child td{border:0}.badge{font-size:11px;font-weight:750;padding:5px 8px;border-radius:30px;white-space:nowrap;display:inline-block;background:#edf0f0;color:#52615d}.badge.pending{background:#fff2d9;color:#8b6100}.badge.approved{background:#e0f2e9;color:#20694b}.badge.revision{background:#fff0df;color:#9c5813}.badge.rejected{background:#ffe7e6;color:#a33737}.badge.ordered{background:#e7ebff;color:#4657a8}.badge.received{background:#d8f3ee;color:#12675b}.bar{height:9px;border-radius:9px;background:#e9eeea;overflow:hidden;margin:10px 0}.bar span{height:100%;display:block;background:#287a69}.project{padding:13px 0;border-bottom:1px solid #edf0ed}.project:last-child{border:0}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#3d544d}input,select,textarea{width:100%;border:1px solid #d4ded8;background:#fff;border-radius:9px;padding:10px 11px;color:#172321}textarea{min-height:85px;resize:vertical}.itemrow{border:1px solid #e1e8e3;padding:16px;border-radius:11px;margin:12px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:40px 12px;text-align:center;color:#75867e}.notice{background:#f0f6f2;border:1px solid #d6e6dc;padding:12px 15px;border-radius:9px;color:#315b4a;font-size:13px;margin-bottom:20px}.alert{background:#fff4df;border-color:#f1dbac;color:#795b21}.hidden{display:none!important}.detail{background:#f7faf8;border-radius:10px;padding:13px;margin:10px 0}.mini{font-size:12px}.right{text-align:right}.divider{height:1px;background:#e8eee9;margin:18px 0}.login{max-width:490px;margin:10vh auto;padding:30px}.login h1{font-size:25px}.login .field{margin:17px 0}.pill{background:#e9f3ee;color:#20594f;border-radius:30px;padding:5px 9px;font-size:12px}.attachment{display:inline-block;background:#edf4f0;padding:6px 9px;border-radius:7px;margin:4px 4px 4px 0;font-size:12px}.nowrap{white-space:nowrap}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{padding:15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:15px;margin:0}.sub,.side .foot{display:none}.side nav{display:flex;gap:4px;flex-wrap:wrap}.side button{width:auto;padding:9px}.main{padding:20px}}@media(max-width:600px){.cards{grid-template-columns:1fr 1fr;gap:9px}.card{padding:13px}.card strong{font-size:20px}.fields{grid-template-columns:1fr}.main{padding:14px}h1{font-size:24px}.top{align-items:flex-start}}
</style></head><body><div id="app"></div><script>
'use strict';const KEY='ses-purchasing-demo-five-teams-v2';const money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toISOString().slice(0,10);const uid=()=>Math.random().toString(36).slice(2,10);const seed=()=>({classBudget:2500,projects:[{id:'p1',name:'Gallery 400',budget:500},{id:'p2',name:'Chicago Art Department',budget:500},{id:'p3',name:'Lawndale Pop-up Spot',budget:500},{id:'p4',name:'Douglass 18',budget:500},{id:'p5',name:'Working Bikes',budget:500}],requests:[],history:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}if(db.classBudget===20000&&db.projects?.length===5&&db.projects.every(p=>p.budget===4000)){db.classBudget=2500;db.projects.forEach(p=>p.budget=500);try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}let user=null,view='dashboard',editId=null,filter='all';let storageError='';function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageError='';return true}catch(e){storageError='Your browser is blocking or has filled local storage. Requests will not persist after reopening this page. Use the same open tab to test role switching.';return false}}function project(id){return db.projects.find(p=>p.id===id)}function allItems(){return db.requests.flatMap(r=>r.items.map(i=>({...i,request:r,project:project(r.projectId)})))}function allowed(){return allItems().filter(i=>user.role!=='team'||i.request.projectId===user.projectId)}function committed(i){return ['approved','ordered','received'].includes(i.status)}function amount(i){return i.status==='received'&&i.actual!==null?Number(i.actual):Number(i.qty)*Number(i.unit)}function stats(pid){const a=allItems().filter(i=>!pid||i.request.projectId===pid);return {requested:a.filter(i=>i.status==='pending'||i.status==='revision').reduce((s,i)=>s+amount(i),0),committed:a.filter(committed).reduce((s,i)=>s+amount(i),0),spent:a.filter(i=>i.status==='received').reduce((s,i)=>s+amount(i),0),pending:a.filter(i=>i.status==='pending').length}}function roleName(){return user.role==='team'?project(user.projectId)?.name:user.role==='faculty'?'Faculty':'Purchasing administrator'}function log(item,action){db.history.unshift({date:new Date().toLocaleString(),item:item.name,action,actor:roleName()})}function badge(s){return `<span class="badge ${esc(s)}">${({pending:'Pending review',approved:'Approved',revision:'Needs revision',rejected:'Rejected',ordered:'Ordered',received:'Received'})[s]||s}</span>`}function notify(t){alert(t)}// Demo-only passcodes: client-side checks are not secure authentication.
const DEMO_PASSCODES={faculty:'StudioFaculty26!',administrator:'StudioAdmin26!'};
function toggleLoginFields(){const isTeam=document.getElementById('loginRole').value==='team';document.getElementById('teamSelect').classList.toggle('hidden',!isTeam);document.getElementById('passwordField').classList.toggle('hidden',isTeam);document.getElementById('loginError').textContent=''}
function login(){document.getElementById('app').innerHTML=`<div class="panel login"><div class="pill" style="display:inline-block;margin-bottom:15px">Submission demo · Five project teams</div><h1>Social Engagement Studio</h1><p class="muted">Materials requests, approvals, purchasing and budgets.</p><div class="notice alert">Demo passcodes only. These are visible in the downloaded source and do not secure data. Do not use for real student records or purchasing approvals.</div><div class="field"><label>Choose demo role</label><select id="loginRole" onchange="toggleLoginFields()"><option value="team">Project team</option><option value="faculty">Faculty</option><option value="administrator">Purchasing administrator</option></select></div><div class="field" id="teamSelect"><label>Project team</label><select id="loginTeam">${db.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div><div class="field hidden" id="passwordField"><label>Demo passcode</label><input id="loginPassword" type="password" autocomplete="off" placeholder="Enter faculty or administrator passcode" onkeydown="if(event.key==='Enter')enter()"></div><div id="loginError" role="alert" style="color:#a33434;font-size:13px;margin:10px 0"></div><button class="btn primary" style="width:100%" onclick="enter()">Enter demo</button></div>`}
function enter(){const role=document.getElementById('loginRole').value;if(role!=='team'&&document.getElementById('loginPassword').value!==DEMO_PASSCODES[role]){document.getElementById('loginError').textContent='Incorrect demo passcode. Please try again.';return}user={role,projectId:document.getElementById('loginTeam').value};view='dashboard';render()}
function logout(){user=null;login()}function nav(v){view=v;editId=null;render()}function render(){if(!user){login();return}const menu=[['dashboard','Overview'],['requests','Requests'],['new','New request'],['purchasing','Purchasing'],['budgets','Budgets'],['history','Activity']].filter(x=>user.role!=='team'||!['purchasing','history'].includes(x[0]));document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div><div class="brand">SOCIAL<br>ENGAGEMENT STUDIO</div><div class="sub">Materials & purchasing</div></div><nav>${menu.map(([id,label])=>`<button class="${view===id?'active':''}" onclick="nav('${id}')">${label}</button>`).join('')}</nav><div class="foot">Local prototype · No server connection<br>Switch roles inside this page to test approvals</div></aside><main class="main"><div class="top"><div><h1>${({dashboard:'Studio overview',requests:'Materials requests',new:'New materials request',purchasing:'Purchasing queue',budgets:'Budget management',history:'Activity log',detail:'Request details'})[view]}</h1><div class="muted">${esc(roleName())} · ${today()}</div></div><div class="actions"><button class="btn tiny" onclick="logout()">Switch role</button>${user.role!=='team'?'<button class="btn tiny" onclick="exportCSV()">Export CSV</button>':''}</div></div>${storageError?`<div class="notice alert">${esc(storageError)}</div>`:''}<div id="content">${content()}</div></main></div>`;if(view==='new')addItem()}function content(){switch(view){case'dashboard':return dashboard();case'requests':return requests();case'new':return newRequest();case'purchasing':return purchasing();case'budgets':return budgets();case'history':return history();case'detail':return detail();default:return dashboard()}}function dashboard(){const pid=user.role==='team'?user.projectId:null,s=stats(pid),budget=pid?project(pid).budget:db.classBudget;return `<div class="cards">${[['Total budget',money(budget)],['Committed + spent',money(s.committed)],['Available',money(budget-s.committed)],['Pending items',s.pending]].map(([a,b])=>`<div class="card"><small>${a}</small><strong>${b}</strong></div>`).join('')}</div><div class="grid"><section class="panel"><div class="toolbar"><h2>Recent requests</h2><button class="btn tiny" onclick="nav('requests')">View all</button></div>${requestTable(allowed().slice().reverse().slice(0,8))}</section><section class="panel"><h2>Project budgets</h2>${db.projects.filter(p=>user.role!=='team'||p.id===user.projectId).map(p=>{let s=stats(p.id),percent=p.budget?Math.min(100,s.committed/p.budget*100):0;return `<div class="project"><div class="between"><b class="mini">${esc(p.name)}</b><span class="mini">${money(p.budget-s.committed)} left</span></div><div class="bar"><span style="width:${percent}%"></span></div><div class="muted">${money(s.committed)} committed of ${money(p.budget)}</div></div>`}).join('')}</section></div>`}function requestTable(items){if(!items.length)return '<div class="empty">No materials requests yet.</div>';return `<div class="tablewrap"><table><thead><tr><th>Material</th><th>Project / Requested by</th><th>Estimate</th><th>Status</th><th></th></tr></thead><tbody>${items.map(i=>`<tr><td><b>${esc(i.name)}</b><div class="muted">Qty ${esc(i.qty)} · Needed ${esc(i.request.needed||'Not set')}</div></td><td>${esc(i.project?.name)}<div class="muted">${esc(i.request.requesterName||'Not recorded')}</div></td><td class="nowrap">${money(i.qty*i.unit)}</td><td>${badge(i.status)}</td><td><button class="btn tiny" onclick="openDetail('${i.request.id}')">Open</button></td></tr>`).join('')}</tbody></table></div>`}function requests(){const a=allowed().filter(i=>filter==='all'||i.status===filter);return `${user.role==='faculty'?`<div class="notice"><b>Faculty review queue:</b> ${allItems().filter(i=>i.status==='pending').length} item(s) awaiting approval. Select a pending item and click Open to review it.</div>`:''}<div class="panel"><div class="toolbar"><select style="max-width:200px" onchange="filter=this.value;render()">${['all','pending','revision','approved','ordered','received','rejected'].map(x=>`<option value="${x}" ${filter===x?'selected':''}>${x==='all'?'All statuses':x}</option>`).join('')}</select><button class="btn primary" onclick="nav('new')">+ New request</button></div>${requestTable(a)}</div>`}function newRequest(){const ps=db.projects.filter(p=>user.role!=='team'||p.id===user.projectId);return `<form class="panel" id="reqForm" onsubmit="submitRequest(event)"><h2>Request information</h2><div class="fields"><div class="field"><label>Project team *</label><select id="projectId" required>${ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Requested by (student name) *</label><input id="requesterName" type="text" maxlength="120" placeholder="First and last name" required></div><div class="field"><label>Needed by *</label><input id="needed" type="date" value="${today()}" required></div><div class="field full"><label>Overall purpose</label><textarea id="purpose" placeholder="What are you building and what will these materials enable?"></textarea></div></div><div class="divider"></div><div class="between"><h2>Materials</h2><button class="btn tiny" type="button" onclick="addItem()">+ Add material</button></div><div id="itemRows"></div><div class="notice">Supporting documents: upload images or PDFs per material (demo limit: 1 MB per file, 2 MB total). For a real deployment, files will be stored securely on the server.</div><div class="actions"><button type="submit" class="btn primary">Submit for faculty review</button><button type="button" class="btn" onclick="nav('requests')">Cancel</button></div></form>`}let itemCount=0;function addItem(){const holder=document.getElementById('itemRows');if(!holder)return;const id=++itemCount;holder.insertAdjacentHTML('beforeend',`<div class="itemrow" id="row${id}"><div class="between"><h3>Material ${id}</h3><button type="button" class="btn tiny danger" onclick="document.getElementById('row${id}').remove()">Remove</button></div><div class="fields"><div class="field full"><label>Material name / specification *</label><input name="name" required placeholder="e.g., 3/4-inch plywood, 4x8 sheet"></div><div class="field"><label>Quantity *</label><input name="qty" type="number" min="0.01" step="any" value="1" required></div><div class="field"><label>Estimated unit cost ($) *</label><input name="unit" type="number" min="0" step=".01" required></div><div class="field"><label>Vendor</label><input name="vendor" placeholder="Store or supplier"></div><div class="field"><label>Product link</label><input name="url" type="url" placeholder="https://..."></div><div class="field"><label>Suggested purchaser</label><select name="buyer"><option value="administrator">Administrator</option><option value="faculty">Faculty</option></select></div><div class="field"><label>Supporting file</label><input name="file" type="file" accept=".pdf,image/*"></div><div class="field full"><label>Why is this material necessary? *</label><textarea name="justification" required placeholder="Describe its role in your design and fabrication plan"></textarea></div></div></div>`)}async function submitRequest(e){e.preventDefault();const rows=[...document.querySelectorAll('.itemrow')];if(!rows.length){notify('Add at least one material.');return}const items=[];let totalFileBytes=0;for(const row of rows){const f=n=>row.querySelector(`[name="${n}"]`),file=f('file').files[0];let files=[];if(file){totalFileBytes+=file.size;if(file.size>1024*1024||totalFileBytes>2*1024*1024){notify('Files must be under 1 MB each and 2 MB total in the demo.');return}const data=await new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(file)});files=[{name:file.name,data}]}items.push({id:uid(),name:f('name').value.trim(),qty:Number(f('qty').value),unit:Number(f('unit').value),vendor:f('vendor').value.trim(),url:f('url').value.trim(),buyer:f('buyer').value,justification:f('justification').value.trim(),status:'pending',actual:null,order:'',notes:'',files})}const requesterName=document.getElementById('requesterName').value.trim();if(!requesterName){notify('Please enter the name of the person requesting these materials.');return}const projectId=document.getElementById('projectId').value;const r={id:uid(),projectId,team:project(projectId).name,requesterName,created:today(),needed:document.getElementById('needed').value,purpose:document.getElementById('purpose').value.trim(),items};db.requests.unshift(r);log(items[0],`Submitted request with ${items.length} item(s)`);const persisted=save();openDetail(r.id);notify(persisted?'Request submitted for faculty review. To test approval, click Switch role at the top of THIS SAME PAGE, enter as Faculty, then open Requests.':'Request created in this tab, but browser storage is unavailable. Switch to Faculty within this same tab to review it; do not reopen the file.')}function openDetail(id){editId=id;view='detail';render()}function detail(){const r=db.requests.find(r=>r.id===editId);if(!r)return '<div class="empty">Request not found.</div>';if(user.role==='team'&&r.projectId!==user.projectId)return '<div class="empty">Access denied.</div>';return `<div class="toolbar"><button class="btn" onclick="nav('requests')">← Back to requests</button><span class="muted">Submitted ${esc(r.created)} · Needed ${esc(r.needed)}</span></div><div class="panel"><h2>${esc(project(r.projectId)?.name)}</h2><div class="muted">Requested by: <b>${esc(r.requesterName||'Not recorded')}</b></div><p class="muted">${esc(r.purpose||'No overall description provided')}</p>${r.items.map(i=>`<div class="itemrow"><div class="between"><div><h3>${esc(i.name)}</h3><span class="muted">${esc(i.qty)} × ${money(i.unit)} = ${money(i.qty*i.unit)}</span></div>${badge(i.status)}</div><div class="detail mini"><b>Why needed:</b> ${esc(i.justification)}<br><b>Vendor:</b> ${esc(i.vendor||'Not specified')}<br><b>Purchaser:</b> ${esc(i.buyer)}${i.url?`<br><b>Product:</b> <a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener noreferrer">Open vendor link</a>`:''}${i.notes?`<br><b>Notes:</b> ${esc(i.notes)}`:''}${i.order?`<br><b>Order / receipt:</b> ${esc(i.order)}`:''}${i.actual!==null?`<br><b>Actual total:</b> ${money(i.actual)}`:''}</div>${i.files.map(f=>`<a class="attachment" href="${esc(f.data)}" download="${esc(f.name)}">📎 ${esc(f.name)}</a>`).join('')}<div class="actions" style="margin-top:12px">${itemActions(i,r)}</div></div>`).join('')}</div>`}function safeUrl(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}function itemActions(i,r){if(user.role==='faculty'&&['pending','revision'].includes(i.status))return `<button class="btn primary tiny" onclick="changeStatus('${r.id}','${i.id}','approved')">Approve</button><button class="btn tiny" onclick="changeStatus('${r.id}','${i.id}','revision')">Request revision</button><button class="btn danger tiny" onclick="changeStatus('${r.id}','${i.id}','rejected')">Reject</button><button class="btn tiny" onclick="editItem('${r.id}','${i.id}')">Edit details</button>`;if(user.role==='team'&&['pending','revision','rejected'].includes(i.status))return `<button class="btn tiny" onclick="editItem('${r.id}','${i.id}')">Edit and resubmit</button>`;if((user.role==='administrator'||user.role==='faculty'&&i.buyer==='faculty')&&i.status==='approved')return `<button class="btn primary tiny" onclick="orderItem('${r.id}','${i.id}')">Mark ordered</button>`;if((user.role==='administrator'||user.role==='faculty')&&i.status==='ordered')return `<button class="btn primary tiny" onclick="receiveItem('${r.id}','${i.id}')">Mark received</button>`;return ''}function findItem(rid,iid){return db.requests.find(r=>r.id===rid)?.items.find(i=>i.id===iid)}function changeStatus(rid,iid,status){const i=findItem(rid,iid);if(user.role!=='faculty'||!i||!['pending','revision'].includes(i.status))return;const s=stats(db.requests.find(r=>r.id===rid).projectId),p=project(db.requests.find(r=>r.id===rid).projectId),cost=i.qty*i.unit;if(status==='approved'&&(s.committed+cost>p.budget||stats().committed+cost>db.classBudget)){if(!confirm('This approval exceeds a project or class budget. Approve anyway?'))return}const note=prompt(status==='approved'?'Approval note (optional):':'Explain the decision:',i.notes||'');if(note===null)return;i.notes=note;i.status=status;log(i,status);save();render()}function editItem(rid,iid){const i=findItem(rid,iid);if(!i)return;if(user.role==='team'&&!['pending','revision','rejected'].includes(i.status))return;const name=prompt('Material name:',i.name);if(name===null||!name.trim())return;const qty=prompt('Quantity:',i.qty);if(qty===null||!(Number(qty)>0))return;const unit=prompt('Unit price ($):',i.unit);if(unit===null||!(Number(unit)>=0))return;const reason=prompt('Justification:',i.justification);if(reason===null||!reason.trim())return;const vendor=prompt('Vendor:',i.vendor);if(vendor===null)return;const url=prompt('Product URL:',i.url);if(url===null)return;i.name=name.trim();i.qty=Number(qty);i.unit=Number(unit);i.justification=reason.trim();i.vendor=vendor;i.url=url;i.status='pending';log(i,'Edited and submitted for review');save();render()}function orderItem(rid,iid){const i=findItem(rid,iid);if(!i||i.status!=='approved'||!(user.role==='administrator'&&i.buyer==='administrator'||user.role==='faculty'&&i.buyer==='faculty'))return;const order=prompt('Enter purchase order number, receipt reference, or vendor confirmation:');if(order===null||!order.trim())return;i.order=order.trim();i.status='ordered';log(i,'Marked ordered');save();render()}function receiveItem(rid,iid){const i=findItem(rid,iid);if(!i||i.status!=='ordered')return;const value=prompt('Actual total paid for this line item ($), including allocated taxes/shipping:',String(i.qty*i.unit));if(value===null||!(Number(value)>=0))return;i.actual=Number(value);i.status='received';log(i,'Marked received at '+money(i.actual));save();render()}function purchasing(){const a=allItems().filter(i=>i.buyer==='administrator'&&['approved','ordered','received'].includes(i.status));return `<div class="notice">Only faculty-approved items assigned to the administrator appear here. Faculty-purchased items remain visible in request details.</div><div class="panel">${requestTable(a)}</div>`}function budgets(){const s=stats();return `<div class="cards"><div class="card"><small>Class allocation</small><strong>${money(db.classBudget)}</strong></div><div class="card"><small>Committed + spent</small><strong>${money(s.committed)}</strong></div><div class="card"><small>Actually spent</small><strong>${money(s.spent)}</strong></div><div class="card"><small>Available</small><strong>${money(db.classBudget-s.committed)}</strong></div></div><section class="panel"><div class="toolbar"><h2>Project allocations</h2>${user.role==='faculty'?'<button class="btn tiny" onclick="editClassBudget()">Edit class budget</button>':''}</div>${db.projects.filter(p=>user.role!=='team'||p.id===user.projectId).map(p=>{const s=stats(p.id);return `<div class="project"><div class="between"><div><b>${esc(p.name)}</b><div class="muted">Allocation ${money(p.budget)} · Spent ${money(s.spent)} · Pending ${money(s.requested)}</div></div><div class="right"><b>${money(p.budget-s.committed)}</b><div class="muted">Available</div>${user.role==='faculty'?`<button class="btn tiny" onclick="editProjectBudget('${p.id}')">Edit budget</button>`:''}</div></div><div class="bar"><span style="width:${p.budget?Math.min(100,s.committed/p.budget*100):0}%"></span></div></div>`}).join('')}</section>`}function editClassBudget(){if(user.role!=='faculty')return;const n=prompt('Class budget ($):',db.classBudget);if(n===null||!(Number(n)>=0))return;db.classBudget=Number(n);save();render()}function editProjectBudget(id){if(user.role!=='faculty')return;const p=project(id),n=prompt('Project budget ($):',p.budget);if(n===null||!(Number(n)>=0))return;p.budget=Number(n);save();render()}function history(){return `<div class="panel">${db.history.length?`<div class="tablewrap"><table><tr><th>When</th><th>Item</th><th>Action</th><th>By</th></tr>${db.history.map(h=>`<tr><td>${esc(h.date)}</td><td>${esc(h.item)}</td><td>${esc(h.action)}</td><td>${esc(h.actor)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No recorded activity.</div>'}</div>`}function exportCSV(){const rows=[['Request ID','Project','Requested by','Material','Quantity','Unit estimate','Estimated total','Status','Purchaser','Vendor','Product URL','Justification','Needed by','Order reference','Actual total','Faculty notes']];allItems().forEach(i=>rows.push([i.request.id,i.project?.name,i.request.requesterName||'',i.name,i.qty,i.unit,i.qty*i.unit,i.status,i.buyer,i.vendor,i.url,i.justification,i.request.needed,i.order,i.actual??'',i.notes]));const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='social-engagement-purchasing-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}login();</script></body></html>
